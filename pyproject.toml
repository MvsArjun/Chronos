[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"
[project]
name = "chronos-quant-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.13,<2", "pyarrow>=17,<27", "requests>=2.32,<3"]
[tool.scikit-build]
wheel.packages = ["python/chronos"]
cmake.args = ["-DCHRONOS_TESTS=OFF", "-DCHRONOS_BENCHMARKS=OFF"]
